# This file is for local development only
# Please use the image generated by the Dockerfile for production
services:
  # This service is used to build the development image
  # As we are using "depends_on: development" in other services, this service will be built first
  # This way, the image is built once and reused by other services
  development-web:
    image: meower:development-web
    pull_policy: never
    build:
      context: .
      dockerfile: ./web/Dockerfile
      target: development-web

  development-api:
    image: meower:development-api
    pull_policy: never
    build:
      context: .
      dockerfile: ./api/Dockerfile
      target: development-api

  web:
    image: meower:development-web
    pull_policy: never
    tty: true
    stop_signal: SIGINT # Graceful shutdown will cleanup the txt files created
    stop_grace_period: 3s
    environment:
      API_ENDPOINT: "api:50051"
      COOKIE_SECRET_KEY: "5TIyDD81Laz/xdxEw2yJVPKdJYyPqxmyONaSVJHs6jY="
      REDIS_URL: "redis://redis:6379"
      ENVIRONMENT: "development"
      LOG_LEVEL: "debug"
      # OpenTelemetry: the web exports traces over OTLP/HTTP to Tempo on 4318.
      # Tempo only runs under the `monitoring` compose profile (see below), so
      # by default this points at a collector that isn't up and the exporter
      # degrades silently (no log spam, spans dropped). Run
      # `docker compose --profile monitoring up` to get traces with zero further
      # config, or set OTEL_EXPORTER_OTLP_ENDPOINT in .env to ship them to a
      # collector of your own.
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-tempo:4318}"
    ports:
      - "3000:3000"
      - "7331:7331"
    working_dir: /src/web/
    volumes:
      - ./web/:/src/web/
      - ./api/:/src/api/
      # The web module replaces ../api, ../pkg/urls and ../pkg/observability,
      # so the pkg sub-modules must be mounted for `go run` to resolve them.
      - ./pkg/:/src/pkg/
      - go_modules:/go/pkg/mod/
    depends_on:
      - api
      - development-web
      - javascript
      - redis
      - rustywind
      - tailwind
    command: 'templ generate -v --watch --proxy="http://localhost:3000" --proxybind="0.0.0.0" --open-browser=false --cmd="go run main.go"'

  tailwind:
    image: meower:development-web
    pull_policy: never
    stop_signal: SIGKILL
    working_dir: /src/web/
    volumes:
      - ./web/:/src/web/
    depends_on:
      - development-web
    command: "tailwindcss -i ./static/src/css/main.css -o ./static/public/css/main.css --config ./tailwind.config.js --watch=always"

  javascript:
    image: oven/bun:alpine
    stop_signal: SIGKILL
    working_dir: /src/web/
    volumes:
      - ./web/:/src/web/
    command: "bun run build-js"

  rustywind:
    image: meower:development-web
    pull_policy: never
    stop_signal: SIGKILL
    working_dir: /src/web/
    volumes:
      - ./web/:/src/web/
    depends_on:
      - development-web
    command: "wgo -verbose -file=\\.templ$ rustywind --write views/**/*.templ"

  api:
    image: meower:development-api
    pull_policy: never
    tty: true
    environment:
      DATABASE_URL: "postgres://meower:meower@db:5432/meower?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      ENVIRONMENT: "development"
      LOG_LEVEL: "debug"
      GRPC_REFLECTION_ENABLED: "true"
      # OpenTelemetry: the api exports traces over OTLP/gRPC to Tempo on 4317.
      # Tempo only runs under the `monitoring` compose profile (see below), so
      # by default this points at a collector that isn't up and the exporter
      # degrades silently (no log spam, spans dropped). Run
      # `docker compose --profile monitoring up` to get traces with zero further
      # config, or set OTEL_EXPORTER_OTLP_ENDPOINT in .env to ship them to a
      # collector of your own.
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-tempo:4317}"
    ports:
      - "50051:50051"
      - "9091:9091" # Prometheus metrics
    working_dir: /src/api/
    volumes:
      - ./api/:/src/api/
      # The api module replaces ../pkg/observability, so the pkg sub-modules
      # must be mounted for `go run` to resolve them at runtime.
      - ./pkg/:/src/pkg/
      - ./scripts/:/src/scripts/
      - go_modules:/go/pkg/mod/
    healthcheck:
      test: [ "CMD", "grpc-health-probe", "-addr=:50051" ]
      interval: 1s
      timeout: 10s
      retries: 10
      # The first `go run` compiles the whole app + deps; give it time before
      # failures count against the container's health.
      start_period: 180s
    depends_on:
      development-api:
        condition: service_started
      db:
        condition: service_healthy
        restart: true
    # Generate protobuf + sqlc code once before starting, then watch+run. This
    # makes `docker compose up` work from a clean checkout (the template ships
    # .proto/.sql sources, not generated .go); the `proto` and `sqlc` services
    # keep them regenerated on subsequent edits.
    command: sh -c "cd /src && ./scripts/generate_protobuf.sh && cd /src/api && sqlc generate -f db/sqlc.yaml && wgo -file=.go go run main.go"

  proto:
    image: meower:development-api
    pull_policy: never
    working_dir: /src/
    volumes:
      - ./api/:/src/api/
      - ./scripts/:/src/scripts/
    depends_on:
      - development-api
    command: "wgo -dir ./api/proto -file=.proto ./scripts/generate_protobuf.sh"

  grpcui:
    image: fullstorydev/grpcui:v1.4.3
    ports:
      - "50050:8080"
    depends_on:
      api:
        condition: service_healthy
        restart: true
    command: -plaintext api:50051

  sqlc:
    image: meower:development-api
    pull_policy: never
    tty: true
    working_dir: /src/api/db/
    volumes:
      - ./api/db/:/src/api/db/
      - go_modules:/go/pkg/mod/
    depends_on:
      - development-api
    command: "wgo -file=sqlc.yaml -file=.sql -xfile=.go -dir /src/api/db sqlc generate -f /src/api/db/sqlc.yaml"

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_HOST_AUTH_METHOD: "trust"
      POSTGRES_USER: "meower"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U meower" ]
      interval: 1s
      timeout: 10s
      retries: 10
    volumes:
      - ./api/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  pgweb:
    image: sosedoff/pgweb
    ports:
      - "5430:8081"
    environment:
      PGWEB_DATABASE_URL: "postgres://meower:meower@db:5432/meower?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy
        restart: true
    command: "--log-level=ERROR"

  mailpit:
    image: axllent/mailpit
    ports:
      - 8025:8025
      - 1025:1025
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 5

  # ===========================================
  # Monitoring stack (Prometheus, Loki, Tempo, Grafana)
  # ===========================================
  # Opt-in: these services only start under the `monitoring` profile. Run
  # `docker compose --profile monitoring up` to bring them up alongside the app.
  # They share the project's default network, so the app reaches Tempo at
  # `tempo:4317`/`tempo:4318` with no extra config. A plain `docker compose up`
  # leaves them stopped and the app's trace exporter degrades silently.
  # See monitoring/README.md for details.

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: TEMPLATE_PROJECT_NAME-prometheus
    profiles: ["monitoring"]
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=15d'
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.0
    container_name: TEMPLATE_PROJECT_NAME-loki
    profiles: ["monitoring"]
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.3.0
    container_name: TEMPLATE_PROJECT_NAME-tempo
    profiles: ["monitoring"]
    ports:
      - "3200:3200"   # Tempo HTTP API
      - "4317:4317"   # OTLP gRPC receiver (api)
      - "4318:4318"   # OTLP HTTP receiver (web)
    volumes:
      - ./monitoring/tempo/tempo-config.yml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/tmp/tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.2.0
    container_name: TEMPLATE_PROJECT_NAME-grafana
    profiles: ["monitoring"]
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      # Development-only default password; set GRAFANA_ADMIN_PASSWORD in prod.
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: unless-stopped

volumes:
  go_modules:
  prometheus_data:
  loki_data:
  tempo_data:
  grafana_data:
